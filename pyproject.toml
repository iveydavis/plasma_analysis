[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swabs"
version = "0.1.0"
description = "1-D modelling of type II and III bursts in stellar coronae/winds"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Ivey Davis" }]
keywords = ["astronomy", "astrophysics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21.6",
    "scipy>=1.7",
    "astropy>=5.3.4",
    "matplotlib>=3.5.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/iveydavis/plasma_analysis"
Issues = "https://github.com/iveydavis/plasma_analysis/issues"

[tool.setuptools]
packages = ["swabs", "swabs.default_vals"]
